<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RO-Crate Photo Browser</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #222; display: flex; height: 100vh; }
    #sidebar { width: 260px; flex-shrink: 0; padding: 1rem; overflow-y: auto; border-right: 1px solid #ddd; box-sizing: border-box; }
    #main { flex: 1; overflow-y: auto; padding: 1rem; box-sizing: border-box; }
    h1 { font-size: 1.1rem; margin: 0 0 1rem; }
    #collections { margin-bottom: 1.5rem; }
    #collections h2 { font-size: 0.85rem; text-transform: uppercase; color: #888; margin: 0 0 0.4rem; }
    #collections-all { display: block; width: 100%; text-align: left; background: none; border: none; padding: 0.25rem 0.4rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem; margin-bottom: 0.3rem; }
    #collections-all:hover { background: #f0f0f0; }
    #collections-all.active { background: #1a5fb4; color: #fff; }
    #collections-tree { max-height: 260px; overflow-y: auto; font-size: 0.85rem; }
    #collections-tree ul { list-style: none; margin: 0; padding-left: 1.1rem; }
    #collections-tree > ul { padding-left: 0; }
    #collections-tree li { padding: 0.1rem 0; }
    #collections-tree summary { cursor: pointer; }
    #collections-tree summary::marker { color: #999; }
    .collection-row { display: block; width: 100%; text-align: left; background: none; border: none; padding: 0.2rem 0.4rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .collection-row:hover { background: #f0f0f0; }
    .collection-row.active { background: #1a5fb4; color: #fff; }
    .collection-folder-name { padding: 0.1rem 0.4rem; font-size: 0.85rem; }

    .facet-group { margin-bottom: 1.5rem; }
    .facet-group h2 { font-size: 0.85rem; text-transform: uppercase; color: #888; margin: 0 0 0.4rem; }
    .facet-group .facet-values { max-height: 220px; overflow-y: auto; }
    .facet-value { display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.25rem 0.4rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .facet-value:hover { background: #f0f0f0; }
    .facet-value.active { background: #1a5fb4; color: #fff; }
    .facet-value .count { color: #888; }
    .facet-value.active .count { color: #cfe0f5; }
    #active-filters { margin-bottom: 1rem; font-size: 0.85rem; }
    #active-filters button { margin-left: 0.4rem; cursor: pointer; }
    #status-bar { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 1rem; }
    #status { color: #555; font-size: 0.9rem; }
    #select-all, #recognize-faces-button { background: none; border: 1px solid #bbb; border-radius: 4px; padding: 0.2rem 0.6rem; font-size: 0.8rem; cursor: pointer; color: #333; }
    #select-all:hover, #recognize-faces-button:hover { background: #f0f0f0; }
    #recognize-faces-button:disabled { opacity: 0.5; cursor: default; }

    #faces-review { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); z-index: 100; flex-direction: column; padding: 1.5rem; box-sizing: border-box; overflow-y: auto; }
    #faces-review.open { display: flex; }
    #faces-review h2 { color: #eee; font-size: 1rem; margin: 0 0 1rem; }
    #faces-review-close { position: fixed; top: 1rem; right: 1.5rem; color: #fff; font-size: 2rem; line-height: 1; cursor: pointer; background: none; border: none; }
    #faces-review-list { display: flex; flex-direction: column; gap: 1.2rem; }
    .faces-review-subheading { color: #ccc; font-size: 0.8rem; text-transform: uppercase; margin: 0; }
    .faces-review-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
    .face-card { background: #222; border-radius: 6px; padding: 0.6rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .face-card canvas { width: 100%; border-radius: 4px; background: #333; }
    .face-card-label { color: #eee; font-size: 0.8rem; }
    .face-card-actions { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .face-card-actions button { background: #333; color: #eee; border: none; border-radius: 4px; padding: 0.25rem 0.5rem; font-size: 0.72rem; cursor: pointer; }
    .face-card-actions button:hover { background: #1a5fb4; }

    .face-match-group { background: #1c1c1c; border: 1px solid #3a3a3a; border-radius: 8px; padding: 0.8rem; }
    .face-match-group-header { display: flex; justify-content: flex-start; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; }
    .face-match-group-header span { color: #eee; font-size: 0.85rem; }
    .face-match-group-header button { background: #1a5fb4; color: #fff; border: none; border-radius: 4px; padding: 0.3rem 0.7rem; font-size: 0.78rem; cursor: pointer; }
    .face-match-group-header button:disabled { opacity: 0.5; cursor: default; }
    .face-match-group-reassign-all { margin-bottom: 0.6rem; }
    .face-match-group-reassign-input { width: 16rem; max-width: 100%; box-sizing: border-box; padding: 0.25rem 0.5rem; font-size: 0.78rem; border: 1px solid #555; border-radius: 4px; background: #111; color: #eee; }
    .face-match-group-reassign-input:disabled { opacity: 0.5; }
    .face-match-thumbs { display: flex; flex-wrap: wrap; gap: 0.7rem; }
    .face-match-thumb { position: relative; width: 150px; display: flex; flex-direction: column; gap: 0.3rem; }
    .face-match-thumb canvas { width: 100%; border-radius: 4px; background: #333; display: block; }
    .face-match-thumb-remove { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; line-height: 18px; padding: 0; border-radius: 50%; background: #b00020; color: #fff; border: none; cursor: pointer; font-size: 0.9rem; z-index: 1; }
    .face-match-thumb-remove:hover { background: #d0002a; }
    .face-match-thumb-input { width: 100%; box-sizing: border-box; padding: 0.2rem 0.4rem; font-size: 0.72rem; border: 1px solid #555; border-radius: 4px; background: #111; color: #eee; }
    .face-match-thumb-actions { display: flex; gap: 0.3rem; }
    .face-match-thumb-actions button { flex: 1; background: #333; color: #eee; border: none; border-radius: 4px; padding: 0.2rem 0.3rem; font-size: 0.68rem; cursor: pointer; }
    .face-match-thumb-actions button:hover { background: #1a5fb4; }

    #selection-bar { display: none; align-items: center; gap: 0.6rem; background: #eef4fc; border: 1px solid #bcd6f2; border-radius: 4px; padding: 0.5rem 0.7rem; margin-bottom: 1rem; font-size: 0.85rem; flex-wrap: wrap; }
    #selection-bar.visible { display: flex; }
    #selection-bar button { background: #1a5fb4; color: #fff; border: none; border-radius: 4px; padding: 0.3rem 0.7rem; font-size: 0.82rem; cursor: pointer; }
    #selection-bar button.danger { background: #b00020; }
    #selection-bar #selection-count { font-weight: 600; margin-right: 0.4rem; }

    dialog#keyword-dialog { border: none; border-radius: 6px; padding: 1rem 1.2rem; width: 22rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25); }
    dialog#keyword-dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
    #keyword-dialog p { margin: 0 0 0.6rem; font-size: 0.85rem; color: #333; }
    #keyword-input-row { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; }
    #keyword-input { flex: 1; padding: 0.3rem 0.5rem; font-size: 0.85rem; border: 1px solid #bbb; border-radius: 4px; }
    #keyword-add-button { width: 2rem; font-size: 1rem; border: 1px solid #1a5fb4; background: #1a5fb4; color: #fff; border-radius: 4px; cursor: pointer; }
    #keyword-chip-list { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.6rem; min-height: 1.6rem; }
    .keyword-chip { background: #eef4fc; border: 1px solid #bcd6f2; border-radius: 10px; padding: 0.15rem 0.3rem 0.15rem 0.6rem; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 0.3rem; }
    .keyword-chip button { background: none; border: none; cursor: pointer; color: #666; font-size: 0.9rem; line-height: 1; padding: 0 0.2rem; }
    #keyword-suggestions-label { font-size: 0.75rem; text-transform: uppercase; color: #888; margin: 0 0 0.3rem; }
    #keyword-suggestions-list { display: flex; flex-wrap: wrap; gap: 0.3rem; max-height: 8rem; overflow-y: auto; margin-bottom: 0.8rem; }
    #keyword-suggestions-list:empty::after { content: 'No matches'; color: #999; font-size: 0.8rem; }
    .keyword-suggestion { background: #f2f2f2; border: 1px solid #ddd; border-radius: 10px; padding: 0.15rem 0.6rem; font-size: 0.8rem; cursor: pointer; }
    .keyword-suggestion:hover { background: #e0ebfa; border-color: #bcd6f2; }
    #keyword-dialog-actions { display: flex; justify-content: flex-end; gap: 0.5rem; }
    #keyword-dialog-actions button { padding: 0.3rem 0.8rem; font-size: 0.82rem; border-radius: 4px; cursor: pointer; }
    #keyword-dialog-submit { background: #1a5fb4; color: #fff; border: none; }
    #keyword-dialog-cancel { background: none; border: 1px solid #bbb; }

    dialog#person-dialog { border: none; border-radius: 6px; padding: 1rem 1.2rem; width: 22rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25); }
    dialog#person-dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
    #person-dialog p { margin: 0 0 0.6rem; font-size: 0.85rem; color: #333; }
    #person-input { width: 100%; box-sizing: border-box; padding: 0.3rem 0.5rem; font-size: 0.85rem; border: 1px solid #bbb; border-radius: 4px; margin-bottom: 0.6rem; }
    #person-suggestions-label { font-size: 0.75rem; text-transform: uppercase; color: #888; margin: 0 0 0.3rem; }
    #person-suggestions-list { display: flex; flex-wrap: wrap; gap: 0.3rem; max-height: 8rem; overflow-y: auto; margin-bottom: 0.8rem; }
    #person-suggestions-list:empty::after { content: 'No matches'; color: #999; font-size: 0.8rem; }
    #person-dialog-actions { display: flex; justify-content: flex-end; gap: 0.5rem; }
    #person-dialog-actions button { padding: 0.3rem 0.8rem; font-size: 0.82rem; border-radius: 4px; cursor: pointer; }
    #person-dialog-submit { background: #1a5fb4; color: #fff; border: none; }
    #person-dialog-cancel { background: none; border: 1px solid #bbb; }

    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
    figure { position: relative; margin: 0; border: 1px solid #ddd; border-radius: 4px; padding: 0.5rem; cursor: pointer; }
    figure img { width: 100%; height: 120px; object-fit: cover; border-radius: 2px; background: #eee; }
    figcaption { font-size: 0.75rem; margin-top: 0.3rem; word-break: break-word; color: #555; }
    .select-checkbox { position: absolute; top: 0.4rem; left: 0.4rem; background: rgba(255, 255, 255, 0.85); border-radius: 3px; padding: 2px; line-height: 0; z-index: 2; }

    .star-rating { display: flex; gap: 1px; margin-top: 0.3rem; }
    .star-rating button { background: none; border: none; cursor: pointer; padding: 0; line-height: 1; font-size: 0.95rem; color: #d9a400; }
    .star-rating button.empty { color: #ccc; }
    .star-rating button:hover { transform: scale(1.15); }
    #viewer-rating .star-rating button { font-size: 1.4rem; }

    #viewer { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); z-index: 100; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; padding: 2rem; box-sizing: border-box; }
    #viewer.open { display: flex; }
    #viewer-image-wrap { position: relative; display: inline-block; max-width: 100%; max-height: 82vh; line-height: 0; }
    #viewer img { max-width: 100%; max-height: 82vh; object-fit: contain; display: block; }
    #viewer-faces { position: absolute; inset: 0; pointer-events: none; }
    #viewer-faces.hidden { display: none; }
    .face-box { position: absolute; border: 2px solid #ffcc00; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6); }
    .face-box-label { position: absolute; top: 100%; left: -2px; margin-top: 2px; background: #ffcc00; color: #222; font-size: 0.7rem; padding: 1px 4px; border-radius: 2px; white-space: nowrap; }
    #viewer-caption { color: #eee; font-size: 0.9rem; text-align: center; }
    #viewer-description { color: #ccc; font-size: 0.85rem; text-align: center; max-width: 40rem; white-space: pre-wrap; }
    #viewer-description:empty { display: none; }
    #viewer-rating { display: flex; justify-content: center; }
    #viewer-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; max-width: 80vw; }
    .viewer-tag { background: #333; color: #eee; border: none; border-radius: 12px; padding: 0.2rem 0.7rem; font-size: 0.78rem; cursor: pointer; }
    .viewer-tag:hover { background: #1a5fb4; color: #fff; }
    #viewer-controls { display: flex; gap: 0.6rem; }
    #viewer-controls button { background: #333; color: #eee; border: none; border-radius: 4px; padding: 0.35rem 0.8rem; font-size: 0.8rem; cursor: pointer; }
    #viewer-controls button.active { background: #1a5fb4; color: #fff; }
    #viewer-controls button:disabled { opacity: 0.4; cursor: default; }
    #viewer-close { position: fixed; top: 1rem; right: 1.5rem; color: #fff; font-size: 2rem; line-height: 1; cursor: pointer; background: none; border: none; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h1>RO-Crate Photo Browser</h1>
    <div id="active-filters"></div>
    <div id="collections">
      <h2>Collections</h2>
      <button id="collections-all">All collections</button>
      <div id="collections-tree"></div>
    </div>
    <div id="facets"></div>
  </div>
  <div id="main">
    <div id="status-bar">
      <div id="status">Loading…</div>
      <button id="select-all">Select All</button>
      <button id="recognize-faces-button">Recognize Faces</button>
    </div>
    <div id="selection-bar">
      <span id="selection-count"></span>
      <button id="selection-add-keyword">Add keyword</button>
      <button id="selection-remove-keyword">Remove keyword</button>
      <button id="selection-set-rating">Set rating</button>
      <button id="selection-delete" class="danger">Delete</button>
      <button id="selection-clear">Clear selection</button>
    </div>
    <div id="grid"></div>
  </div>

  <div id="viewer">
    <button id="viewer-close" aria-label="Close">&times;</button>
    <div id="viewer-image-wrap">
      <img id="viewer-image" alt="" />
      <div id="viewer-faces" class="hidden"></div>
    </div>
    <div id="viewer-rating"></div>
    <div id="viewer-controls">
      <button id="viewer-faces-toggle" disabled>Show faces</button>
      <button id="viewer-add-keyword">Add keyword</button>
      <button id="viewer-edit-title">Edit title</button>
      <button id="viewer-edit-description">Edit description</button>
      <button id="viewer-delete">Delete</button>
    </div>
    <div id="viewer-caption"></div>
    <div id="viewer-description"></div>
    <div id="viewer-tags"></div>
  </div>

  <div id="faces-review">
    <button id="faces-review-close" aria-label="Close">&times;</button>
    <h2 id="faces-review-heading">Review faces</h2>
    <div id="faces-review-list"></div>
  </div>

  <dialog id="keyword-dialog">
    <form method="dialog">
      <p id="keyword-dialog-description"></p>
      <div id="keyword-input-row">
        <input type="text" id="keyword-input" list="keyword-datalist" placeholder="Type a keyword" autocomplete="off" />
        <button type="button" id="keyword-add-button" aria-label="Add this keyword to the list" title="Add this keyword to the list">+</button>
      </div>
      <datalist id="keyword-datalist"></datalist>
      <div id="keyword-chip-list"></div>
      <p id="keyword-suggestions-label">Existing keywords:</p>
      <div id="keyword-suggestions-list"></div>
      <div id="keyword-dialog-actions">
        <button type="button" id="keyword-dialog-cancel">Cancel</button>
        <button type="submit" id="keyword-dialog-submit" value="submit">Add</button>
      </div>
    </form>
  </dialog>

  <dialog id="person-dialog">
    <form method="dialog">
      <p id="person-dialog-description"></p>
      <input type="text" id="person-input" list="person-datalist" placeholder="Type a name" autocomplete="off" />
      <datalist id="person-datalist"></datalist>
      <p id="person-suggestions-label">Existing people:</p>
      <div id="person-suggestions-list"></div>
      <div id="person-dialog-actions">
        <button type="button" id="person-dialog-cancel">Cancel</button>
        <button type="submit" id="person-dialog-submit" value="submit">Confirm</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/face-api.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
